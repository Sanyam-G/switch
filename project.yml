name: Switch
options:
  bundleIdPrefix: com.sanyamgarg
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: "WCAFS55H9G"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    "CODE_SIGN_IDENTITY[sdk=macosx*]": "Developer ID Application"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.0.0
targets:
  Switch:
    type: application
    platform: macOS
    sources:
      - path: Sources/Switch
    dependencies:
      - package: Sparkle
      - framework: /System/Library/PrivateFrameworks/SkyLight.framework
        embed: false
    settings:
      base:
        PRODUCT_NAME: Switch
        PRODUCT_BUNDLE_IDENTIFIER: com.sanyamgarg.switch
        INFOPLIST_FILE: Sources/Switch/Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: Sources/Switch/Resources/Switch.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Switch/Switch-Bridging-Header.h
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.sanyamgarg.switch.debug
